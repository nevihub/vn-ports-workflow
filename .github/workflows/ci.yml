name: ci
on:
  push:
  pull_request:
jobs:
  test:
    # Linux only: the workflow must never need Windows-only or paid tooling, game data, or secrets.
    runs-on: ubuntu-latest
    # Fixture tests make local commits; a fresh runner has no git identity.
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: syntax sweep (every board + template script must parse)
        run: |
          for f in board/*.mjs board/lib/*.mjs templates/scripts/*.mjs; do
            node --check "$f" || exit 1
          done
      - name: scaffold smoke + synthetic-fixture journey
        run: node --test board/tests/new-port.test.mjs board/tests/proof-freshness.test.mjs board/tests/template-hygiene.test.mjs board/tests/firewall-gates.test.mjs
